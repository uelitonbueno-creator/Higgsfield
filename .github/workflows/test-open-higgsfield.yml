name: Test OpenHiggsfield build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-open-higgsfield.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate stage dance preset
        run: node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('presets/stage-dance-reference.json','utf8')); if(p.model!=='seedance-2.5'||p.settings.aspectRatio!=='9:16'||!p.prompt) process.exit(1); console.log('Preset OK:', p.name)"

      - name: Production build
        run: pnpm build
